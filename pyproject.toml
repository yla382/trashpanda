[tool.poetry]
name = "dumpsterpanda"
version = "0.0.4"
description = "Run models bigger than your GPU: layer-by-layer weight streaming across GPU, RAM and disk."
authors = ["yla382"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/yla382/trashpanda"
keywords = ["pytorch", "offloading", "low-vram", "safetensors", "quantization", "inference"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "trash_panda", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9"
safetensors = ">=0.4.3"
# torch is deliberately NOT listed: install the build that matches your GPU/CUDA first
# (pip install torch --index-url https://download.pytorch.org/whl/cu121), then install this package.

[tool.poetry.group.dev.dependencies]
pytest = "*"
psutil = "*"
numpy = "*"      # safetensors.torch.save_file (used by the tests) needs it
# CPU-only torch for running the tests. Real users install the build that matches their GPU themselves.
torch = { version = ">=2.1", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
