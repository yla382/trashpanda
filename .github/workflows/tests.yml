name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:           # lets publish.yml run these same tests before releasing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install dependencies (from poetry.lock, CPU-only torch)
        run: |
          poetry env use python
          poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest -q
